<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMTV | Total Restoration Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .text-neon { color: #ccff00; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .title-glow { text-shadow: 0 0 20px rgba(204, 255, 0, 0.4); }
        
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee { animation: marquee 20s linear infinite; }
        .animate-marquee-slow { animation: marquee 40s linear infinite; }
        
        .swiper-slide img { width: 100%; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <!-- Nav Simulation -->
    <nav class="navbar navbar-expand-lg fixed-top glass p-3">
        <div class="container">
            <a href="#" class="navbar-brand text-neon font-black text-2xl tracking-tighter">STREAMTV</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="min-h-screen flex flex-col justify-center items-center text-center pt-20 px-4">
        <p class="text-neon uppercase tracking-[0.3rem] text-sm mb-4">ESSAYEZ STREAMTV GRATUITEMENT</p>
        <h1 class="text-5xl md:text-8xl font-black uppercase mb-10">L'EXPÉRIENCE <span class="text-neon title-glow">STREAMTV</span></h1>
        <img src="https://raw.githubusercontent.com/azroukarim/strzone/refs/heads/main/png/header.jpg" class="max-w-4xl w-full rounded-3xl border border-white/10 shadow-2xl">
    </section>

    <!-- Sports Marquee -->
    <section class="py-20 border-t border-white/5 overflow-hidden">
        <h2 class="text-center text-4xl font-black uppercase mb-12 italic">Exclusive <span class="text-neon">Sports</span></h2>
        <div class="flex animate-marquee-slow w-max gap-6 px-6">
            <img src="https://i.postimg.cc/j5LBsFxx/1767639568602.webp" class="h-[400px] rounded-2xl">
            <img src="https://i.postimg.cc/76fjxWHZ/1767640143435.webp" class="h-[400px] rounded-2xl">
            <img src="https://i.postimg.cc/KzRCZHGz/1767640526245.webp" class="h-[400px] rounded-2xl">
            <img src="https://i.postimg.cc/nzCNHPFL/1767641079066.webp" class="h-[400px] rounded-2xl">
            <!-- Duplicate -->
            <img src="https://i.postimg.cc/j5LBsFxx/1767639568602.webp" class="h-[400px] rounded-2xl">
            <img src="https://i.postimg.cc/76fjxWHZ/1767640143435.webp" class="h-[400px] rounded-2xl">
        </div>
    </section>

    <!-- Entertainment Grid -->
    <section class="py-20 bg-zinc-950">
        <div class="container grid md:grid-cols-3 gap-8">
            <div class="glass p-8 rounded-3xl text-center">
                <span class="text-5xl block mb-4">⚽</span>
                <h3 class="text-2xl font-black uppercase">Sports en <span class="text-neon">Direct</span></h3>
            </div>
            <div class="glass p-8 rounded-3xl text-center border-neon/30">
                <span class="text-5xl block mb-4">🌍</span>
                <h3 class="text-2xl font-black uppercase">+20 000 <span class="text-neon">Chaînes</span></h3>
            </div>
            <div class="glass p-8 rounded-3xl text-center">
                <span class="text-5xl block mb-4">🎬</span>
                <h3 class="text-2xl font-black uppercase">+300 000 <span class="text-neon">Films</span></h3>
            </div>
        </div>
    </section>

    <!-- Platform Logos -->
    <div class="py-12 border-y border-white/5 overflow-hidden">
        <div class="flex animate-marquee gap-20 items-center">
            <img src="https://i.postimg.cc/sD1bDCV3/Netflix.jpg" class="h-12 grayscale">
            <img src="https://i.postimg.cc/nrfMVGmM/Shahid.jpg" class="h-12 grayscale">
            <img src="https://i.postimg.cc/9fTsydSF/hbo-max-seeklogo.jpg" class="h-12 grayscale">
            <img src="https://i.postimg.cc/fTk1TQwT/bein-sports-2.jpg" class="h-12 grayscale">
            <img src="https://i.postimg.cc/V66WB1Z9/canal-futbol-seeklogo-com.jpg" class="h-12 grayscale">
            <!-- Duplicate -->
            <img src="https://i.postimg.cc/sD1bDCV3/Netflix.jpg" class="h-12 grayscale">
            <img src="https://i.postimg.cc/nrfMVGmM/Shahid.jpg" class="h-12 grayscale">
        </div>
    </div>

    <!-- Swiper Simulation -->
    <section class="py-24 container">
        <h2 class="text-center text-3xl font-black uppercase mb-12">Plateformes <span class="text-neon">Supportées</span></h2>
        <div class="swiper" id="testSwiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="https://oraplayers.com/wp-content/uploads/2025/06/samsung-C7oYzsWJ.webp"></div>
                <div class="swiper-slide"><img src="https://oraplayers.com/wp-content/uploads/2025/06/sony-DwBFXbcc.webp"></div>
                <div class="swiper-slide"><img src="https://oraplayers.com/wp-content/uploads/2025/06/android-tv-UsQxSlZl.webp"></div>
                <div class="swiper-slide"><img src="https://oraplayers.com/wp-content/uploads/2025/06/lg-webos-CNHJIF8M.webp"></div>
            </div>
        </div>
    </section>

    <footer class="py-10 text-center border-t border-white/5 mt-20">
        <p class="text-gray-500">© 2024 <span class="text-neon">STREAMTV</span> - Final Restoration Test</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        new Swiper('#testSwiper', {
            slidesPerView: 2,
            spaceBetween: 20,
            loop: true,
            autoplay: { delay: 3000 },
            breakpoints: { 768: { slidesPerView: 4 } }
        });
    </script>
</body>
</html>

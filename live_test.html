<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMTV | Final Working Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; }
        .navbar-brand { font-family: 'Urbanist', sans-serif; font-weight: 800; color: #ccff00 !important; }
        .custom-nav-link { color: #fff !important; font-weight: 600; padding: 1rem !important; }
        .collapse.show { display: block !important; background: rgba(0,0,0,0.9); margin-top: 10px; border-radius: 15px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg p-4">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">STREAMTV</a>
            
            <button id="testToggler" class="navbar-toggler" type="button" style="border: none !important;">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ccff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>

            <div class="collapse navbar-collapse" id="testMenu">
                <ul class="navbar-nav mx-auto text-center">
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link active">ACCUEIL</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">VOIR LES PLANS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        document.getElementById('testToggler').addEventListener('click', function() {
            document.getElementById('testMenu').classList.toggle('show');
        });
    </script>

</body>
</html>

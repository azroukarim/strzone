<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMTV | Desktop Navigation Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .main-header { background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 1rem 0; }
        .custom-nav-link { color: #fff !important; font-weight: 700; padding: 0.5rem 1rem !important; transition: 0.3s; }
        .custom-nav-link:hover { color: #ccff00 !important; }
        .navbar-brand { font-family: 'Urbanist'; font-weight: 800; color: #ccff00 !important; font-size: 1.5rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg main-header">
        <div class="container-fluid" style="max-width: 1400px;">
            <a href="#" class="navbar-brand">STREAMTV</a>
            <div class="collapse navbar-collapse show" id="mainMenu"> <!-- Added .show for test visibility -->
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">ACCUEIL</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">PLANS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">BOUQUETS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">TEST</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">TÉLÉCHARGEMENTS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">PROMOS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">CONTACT</a></li>
                </ul>
                <div class="d-flex">
                    <button class="bg-white/10 px-4 py-2 rounded-full border border-white/20 text-sm">🌐 FR</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="py-20 text-center">
        <h1 class="text-3xl font-black">TEST VERSION ORDINATEUR</h1>
        <p class="text-gray-500 mt-4">Tous les menus et le bouton de langue doivent être visibles horizontalement.</p>
    </div>

</body>
</html>

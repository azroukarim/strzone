<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREAMZONE | Live Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .text-neon { color: #ccff00; }
        #preloader { position: fixed; inset: 0; background: #000; display: flex; justify-content: center; align-items: center; z-index: 99999; transition: 0.8s ease; }
        #preloader.fade-out { opacity: 0; visibility: hidden; }
        
        /* Fixed Navbar CSS */
        .navbar-collapse { display: none; }
        .navbar-collapse.show { display: block !important; }
        @media (min-width: 992px) {
            .navbar-collapse { display: flex !important; flex-basis: auto; }
        }
        
        .page-section { display: none; padding-top: 100px; min-height: 100vh; }
        .page-section.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="text-4xl font-black text-neon tracking-tighter uppercase italic">STREAMZONE</div>
    </div>

    <nav class="navbar navbar-expand-lg fixed-top glass p-3">
        <div class="container">
            <a href="#" class="navbar-brand text-neon font-black text-2xl tracking-tighter" onclick="showPage('home')">STREAMZONE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon" style="filter: invert(1) brightness(2);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto gap-4 text-xs font-bold uppercase tracking-widest text-center">
                    <li class="nav-item"><a href="javascript:void(0)" onclick="showPage('home')" class="nav-link text-neon">ACCUEIL</a></li>
                    <li class="nav-item"><a href="javascript:void(0)" onclick="showPage('plans')" class="nav-link text-white">VOIR LES PLANS</a></li>
                    <li class="nav-item"><a href="javascript:void(0)" onclick="showPage('download')" class="nav-link text-white">TÉLÉCHARGEMENTS</a></li>
                    <li class="nav-item"><a href="javascript:void(0)" onclick="showPage('promos')" class="nav-link text-white">PROMOS</a></li>
                    <li class="nav-item"><a href="javascript:void(0)" onclick="showPage('contact')" class="nav-link text-white">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- HOME SECTION -->
    <section id="home" class="page-section active">
        <div class="container text-center py-20">
            <p class="text-neon uppercase tracking-[0.4rem] text-sm mb-4">Essayer Streamzone Gratuitement</p>
            <h1 class="text-6xl md:text-8xl font-black uppercase leading-tight mb-10">DÉCOUVREZ <br><span class="text-neon italic">L'EXPÉRIENCE</span></h1>
            <img src="https://raw.githubusercontent.com/azroukarim/strzone/refs/heads/main/png/header.jpg" class="max-w-4xl w-full mx-auto rounded-3xl border border-white/10 shadow-2xl">
        </div>
    </section>

    <!-- PLANS SECTION -->
    <section id="plans" class="page-section">
        <div class="container py-20">
            <h2 class="text-5xl font-black text-center mb-16 uppercase">NOS <span class="text-neon">PLANS</span></h2>
            <div class="grid md:grid-cols-3 gap-8">
                <div class="glass p-10 rounded-3xl text-center border-neon/20">
                    <h3 class="text-2xl font-bold mb-4">BASIC</h3>
                    <div class="text-4xl font-black mb-6 text-neon">250 DH</div>
                    <button class="w-full bg-white/10 py-3 rounded-xl font-bold">COMMANDER</button>
                </div>
                <div class="glass p-10 rounded-3xl text-center border-neon bg-neon/5 scale-110">
                    <h3 class="text-2xl font-bold mb-4">STANDARD</h3>
                    <div class="text-4xl font-black mb-6 text-neon">400 DH</div>
                    <button class="w-full bg-neon text-black py-3 rounded-xl font-bold">COMMANDER</button>
                </div>
                <div class="glass p-10 rounded-3xl text-center border-neon/20">
                    <h3 class="text-2xl font-bold mb-4">PREMIUM</h3>
                    <div class="text-4xl font-black mb-6 text-neon">600 DH</div>
                    <button class="w-full bg-white/10 py-3 rounded-xl font-bold">COMMANDER</button>
                </div>
            </div>
        </div>
    </section>

    <!-- DOWNLOAD SECTION -->
    <section id="download" class="page-section">
        <div class="container py-20 text-center">
            <h2 class="text-5xl font-black mb-16 uppercase">NOS <span class="text-neon">APPS</span></h2>
            <div class="grid md:grid-cols-3 gap-8">
                <div class="glass p-8 rounded-3xl"><i data-lucide="smartphone" class="mx-auto mb-4 text-neon"></i><h4 class="font-bold">ANDROID</h4></div>
                <div class="glass p-8 rounded-3xl"><i data-lucide="monitor" class="mx-auto mb-4 text-neon"></i><h4 class="font-bold">WINDOWS</h4></div>
                <div class="glass p-8 rounded-3xl"><i data-lucide="tv" class="mx-auto mb-4 text-neon"></i><h4 class="font-bold">SMART TV</h4></div>
            </div>
        </div>
    </section>

    <footer class="py-10 text-center border-t border-white/5 mt-20">
        <p class="text-gray-500">© 2024 <span class="text-neon">STREAMZONE</span> - Full Demo</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        lucide.createIcons();
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
            const navCollapse = document.getElementById('navMenu');
            if(navCollapse.classList.contains('show')) {
                bootstrap.Collapse.getInstance(navCollapse).hide();
            }
        }
        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('preloader').classList.add('fade-out'), 1500);
        });
    </script>
</body>
</html>

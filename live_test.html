<!DOCTYPE html>
<html lang="fr">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .main-header { background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); padding: 1rem 0; }
        .custom-nav-link { font-weight: 700; color: #fff !important; padding: 0.5rem 1.2rem !important; border-radius: 30px; }
        .custom-nav-link.active { background: #ccff00; color: #000 !important; }

            .navbar-collapse {
                background: rgba(0, 0, 0, 0.95); margin-top: 1rem; padding: 2rem 1rem;
                border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            }
            .navbar-nav { gap: 1rem !important; }
        }
    </style>
</head>
<body class="bg-black">

    <nav class="navbar navbar-expand-lg main-header sticky-top">
        <div class="container-fluid">
            <a href="#" class="navbar-brand text-white font-black text-2xl" style="font-family: 'Urbanist'">STREAMTV</a>
            
            <button class="navbar-toggler" type="button" onclick="document.getElementById('streamNavbar').classList.toggle('show')" style="border: none !important;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>

                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link active">ACCUEIL</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">VOIR LES PLANS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">BOUQUETS</a></li>
                    <li class="nav-item"><a href="#" class="nav-link custom-nav-link">CONTACT</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="py-20 text-center">
        <h1 class="text-4xl font-black">TEST DE RESTAURATION</h1>
        <p class="text-gray-500 mt-4">La liste déroulante doit maintenant "pousser" ce texte vers le bas.</p>
    </div>

</body>
</html>
